<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#A63D2F" />
    <title>Offline · Vabani Bricks</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f7f5; color: #252525;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
      .card { max-width: 380px; background: #fff; border: 1px solid #e7e2da; border-radius: 12px; padding: 28px; text-align: center; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #6b6b6b; font-size: 14px; line-height: 1.5; }
      a { display: inline-block; margin-top: 12px; background: #a63d2f; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon.svg" width="48" height="48" alt="" />
      <h1>You are offline</h1>
      <p>This page needs a connection. The <b>New Invoice</b> screen works offline if you opened it before: drafts are saved on this device and sync when you reconnect. Nothing is finalized until the server confirms it.</p>
      <a href="/staff/new-invoice">Open New Invoice</a>
    </div>
  </body>
</html>
